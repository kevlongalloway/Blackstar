<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — BLACKSTAR</title>
  <meta property="og:title" content="Shop — BLACKSTAR">
  <meta property="og:description" content="The Void Series — BLACKSTAR">
  <meta property="og:image" content="https://blackstarthebrand.onrender.com/IMG_1306.jpeg">
  <meta property="og:url" content="https://blackstarthebrand.onrender.com/products.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://blackstarthebrand.onrender.com/IMG_1306.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background: #080808;
      color: #f0ede8;
      font-family: 'Space Mono', monospace;
      cursor: crosshair;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 100;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (min-width: 640px) {
      nav { padding: 28px 40px; }
    }

    .nav-mark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.2em;
      opacity: 0.8;
      text-decoration: none;
      color: #f0ede8;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      font-size: 10px;
      color: #f0ede8;
      text-decoration: none;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }
    .nav-links a.active { opacity: 1; }

    /* Page header */
    .page-header {
      padding: 140px 24px 48px;
      border-bottom: 1px solid rgba(240,237,232,0.08);
      margin-bottom: 48px;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .page-header { padding: 140px 40px 48px; }
    }

    .page-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      opacity: 0.35;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 9vw, 120px);
      line-height: 0.92;
    }

    .product-count {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.3;
      margin-top: 20px;
      text-transform: uppercase;
    }

    /* Grid */
    .shop {
      padding: 0 24px 80px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .shop { padding: 0 40px 100px; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      text-decoration: none;
      color: inherit;
      display: block;
      min-width: 0;
    }

    .card-img {
      aspect-ratio: 3/4;
      background: #121212;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img img {
      transform: scale(1.06);
    }

    /* Swipable image carousel */
    .card-media {
      position: relative;
      aspect-ratio: 3/4;
      background: #121212;
      overflow: hidden;
    }

    .card-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .card-track::-webkit-scrollbar { display: none; }

    .card-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
    }

    .card-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      display: block;
    }

    .card:hover .card-slide img { transform: scale(1.06); }

    .card-dots {
      position: absolute;
      left: 0; right: 0; bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 2;
      pointer-events: none;
    }

    .card-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(240,237,232,0.35);
      transition: background 0.25s, transform 0.25s;
    }

    .card-dot.active {
      background: #f0ede8;
      transform: scale(1.3);
    }

    .card-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      background: rgba(8,8,8,0.5);
      color: #f0ede8;
      border: none;
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      line-height: 1;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 3;
    }

    .card-media:hover .card-arrow { opacity: 0.7; }
    .card-arrow:hover { opacity: 1; }
    .card-arrow.prev { left: 6px; }
    .card-arrow.next { right: 6px; }

    @media (hover: none) {
      .card-arrow { display: none; }
    }

    .card-info {
      padding: 12px 2px 4px;
    }

    .card-name {
      display: block;
      font-size: 10px;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price {
      display: block;
      font-size: 10px;
      opacity: 0.45;
    }

    /* Loading / empty states */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      opacity: 0.4;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 60px 0;
    }

    /* Footer */
    footer {
      background: #f0ede8;
      color: #080808;
      padding: 60px 24px 36px;
    }

    @media (min-width: 640px) {
      footer { padding: 60px 40px 36px; }
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(8,8,8,0.12);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }

    footer img { width: 200px; }

    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }

    .footer-links a {
      font-size: 10px;
      color: #080808;
      text-decoration: none;
      letter-spacing: 0.15em;
      opacity: 0.4;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .footer-links a:hover { opacity: 1; }

    .footer-copy {
      font-size: 9px;
      opacity: 0.3;
      letter-spacing: 0.1em;
    }

    .footer-bottom {
      background: #080808;
      color: #f0ede8;
      text-align: center;
      padding: 12px 16px;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .footer-bottom a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-mark" href="index.html">BST★</a>
    <div class="nav-links">
      <a href="products.html" class="active">Shop</a>
      <!-- <a href="#">Drops</a> -->
      <a href="about.html">About</a>
      <a href="archive.html">Archive</a>
      <a href="cart.html" class="cart-nav-link">Cart</a>
    </div>
  </nav>

  <div class="page-header">
    <p class="page-label">— All Products</p>
    <h1 class="page-title">SHOP</h1>
    <p class="product-count" id="product-count"></p>
  </div>

  <section class="shop">
    <div class="grid" id="products-grid">
      <p class="state-msg">Loading...</p>
    </div>
  </section>

  <footer>
    <div class="footer-top">
      <img src="IMG_1309.png" alt="BLACKSTAR">
      <div class="footer-links">
        <a href="#">Instagram</a>
        <a href="#">TikTok</a>
        <a href="#">Sizing</a>
        <a href="#">Returns</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 BLACKSTAR</p>
  </footer>

  <div class="footer-bottom">
    © 2026, BlackStar the Brand Powered by <a href="https://upcart.online" target="_blank" rel="noopener">upcart.online</a>
  </div>

  <script src="config.js"></script>
  <script src="cart.js"></script>
  <script>
    async function loadProducts() {
      const grid    = document.getElementById('products-grid');
      const countEl = document.getElementById('product-count');

      try {
        // Paginate through all products
        let all = [], offset = 0, limit = 100;
        while (true) {
          const res  = await fetch('https://ecommaxxing.kevlongalloway1999m.workers.dev/products?limit=' + limit + '&offset=' + offset);
          const body = await res.json();
          if (!body.ok) throw new Error(body.error);
          if (!body.data.length) break;
          all    = all.concat(body.data);
          offset += body.data.length;
          if (body.data.length < limit) break;
        }
        if (all.length === 0) {
          grid.innerHTML = '<p class="state-msg">No products available.</p>';
          return;
        }
        countEl.textContent = all.length + ' item' + (all.length !== 1 ? 's' : '');
        grid.innerHTML = all.map(product => {
          const images = Array.isArray(product.images) ? product.images.filter(Boolean) : [];
          let media;
          if (images.length > 1) {
            const slides = images.map(src =>
              `<div class="card-slide"><img src="${src}" alt="${product.name}" loading="lazy"></div>`
            ).join('');
            const dots = images.map((_, i) =>
              `<span class="card-dot${i === 0 ? ' active' : ''}"></span>`
            ).join('');
            media = `
              <div class="card-media">
                <div class="card-track">${slides}</div>
                <button type="button" class="card-arrow prev" aria-label="Previous image">‹</button>
                <button type="button" class="card-arrow next" aria-label="Next image">›</button>
                <div class="card-dots">${dots}</div>
              </div>`;
          } else {
            const image = images[0] || null;
            media = `
              <div class="card-img">
                ${image ? `<img src="${image}" alt="${product.name}" loading="lazy">` : ''}
              </div>`;
          }
          return `
          <a href="product.html?id=${product.id}" class="card">
            ${media}
            <div class="card-info">
              <span class="card-name">${product.name}</span>
              <span class="card-price">${formatPrice(product.price, product.currency)}</span>
            </div>
          </a>`;
        }).join('');

        initCarousels(grid);
      } catch (err) {
        console.error('Failed to load products:', err.message);
        grid.innerHTML = '<p class="state-msg">Error loading products.</p>';
      }
    }

    function initCarousels(root) {
      root.querySelectorAll('.card-media').forEach(media => {
        const track = media.querySelector('.card-track');
        const dots  = Array.from(media.querySelectorAll('.card-dot'));
        const prev  = media.querySelector('.card-arrow.prev');
        const next  = media.querySelector('.card-arrow.next');
        if (!track) return;

        const slideCount = dots.length;
        const currentIndex = () => Math.round(track.scrollLeft / track.clientWidth);

        // Update active dot as the user swipes/scrolls
        let raf = null;
        track.addEventListener('scroll', () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = null;
            const i = currentIndex();
            dots.forEach((d, di) => d.classList.toggle('active', di === i));
          });
        });

        const goTo = i => {
          const clamped = Math.max(0, Math.min(slideCount - 1, i));
          track.scrollTo({ left: clamped * track.clientWidth, behavior: 'smooth' });
        };

        // Arrow buttons live inside the card's <a>, so stop navigation
        const arrow = (el, dir) => {
          if (!el) return;
          el.addEventListener('click', e => {
            e.preventDefault();
            e.stopPropagation();
            goTo(currentIndex() + dir);
          });
        };
        arrow(prev, -1);
        arrow(next, 1);
      });
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>

</body>
</html>
